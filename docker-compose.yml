# Local PostgreSQL for development and test runs.
# Start: docker compose up -d      Stop: docker compose down      Wipe data: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    container_name: beecollab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beecollab
      POSTGRES_PASSWORD: beecollab
      POSTGRES_DB: beecollab
    ports:
      - "5432:5432"
    volumes:
      - beecollab-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beecollab -d beecollab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beecollab-db-data:
